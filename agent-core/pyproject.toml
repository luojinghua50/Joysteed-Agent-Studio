[project]
name = "agent-core"
version = "0.1.0"
description = "Multi-Agent Customer Service System based on LangGraph"
requires-python = ">=3.11"

dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "structlog>=24.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "langfuse>=3.10,<4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b",
    "opentelemetry-exporter-otlp>=1.28",
    "prometheus-client>=0.21",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.3.4",
    "pymilvus>=2.4",
    "fastembed>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "fakeredis>=2.21",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
