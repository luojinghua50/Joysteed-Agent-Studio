global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "agent-core"
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-core:8000"]

  - job_name: "litellm"
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
